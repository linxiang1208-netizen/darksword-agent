name: Build collector_v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Build dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iOS SDK: $SDK"
          
          # Step 1: Compile to object
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -Oz -fPIC -fno-stack-protector \
            -c -o collector.o \
            src/collector_v2.c
          
          echo "=== Object symbols ==="
          nm collector.o
          
          # Step 2: Link as dylib (no -exported_symbol, use default visibility)
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -dynamiclib \
            -Wl,-install_name,@rpath/libcollector.dylib \
            -o libcollector.dylib \
            collector.o
          
          echo "=== Exit: $? ==="
          file libcollector.dylib
          otool -hv libcollector.dylib
          echo "=== Segments ==="
          otool -l libcollector.dylib | grep -E "(segname|vmaddr|vmsize)" | head -12
          echo "=== Symbols ==="
          nm libcollector.dylib | grep _process
          echo "=== Size ==="
          ls -la libcollector.dylib
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: collector-v2
          path: libcollector.dylib