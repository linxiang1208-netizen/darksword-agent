name: Build Collector Dylib
on:
  workflow_dispatch: {}
  push:
    branches: [master]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build collector.dylib for iOS arm64
        run: |
          set -x
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          
          # First test: compile a minimal dylib
          echo 'void _process(void) {}' > /tmp/test.c
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib -o /tmp/test.dylib /tmp/test.c -isysroot "$SDK" -miphoneos-version-min=13.0 2>&1
          echo "Test result: $?"
          file /tmp/test.dylib
          
          # Now compile the real collector
          echo "=== Compiling collector ==="
          ls -la src/
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -O2 \
            -fPIC \
            -o collector.dylib \
            src/collector_cf.c \
            -isysroot "$SDK" \
            -miphoneos-version-min=13.0 2>&1
          echo "Compile result: $?"
          
          if [ -f collector.dylib ]; then
            echo "=== SUCCESS ==="
            file collector.dylib
            nm -g collector.dylib | grep _process
            ls -la collector.dylib
          else
            echo "BUILD FAILED"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: collector-dylib
          path: collector.dylib
          retention-days: 30