name: Build Collector Dylib
on:
  workflow_dispatch: {}
  push:
    branches: [master]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build collector.dylib for iOS arm64
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          
          # Compile and capture errors
          COMPILE_OUTPUT=$(xcrun -sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -O2 \
            -fPIC \
            -o collector.dylib \
            src/collector_cf.c \
            -isysroot "$SDK" \
            -miphoneos-version-min=13.0 \
            2>&1)
          COMPILE_EXIT=$?
          
          echo "$COMPILE_OUTPUT"
          
          if [ $COMPILE_EXIT -ne 0 ]; then
            echo "::error::Compilation failed: $COMPILE_OUTPUT"
            exit 1
          fi
          
          echo "=== SUCCESS ==="
          file collector.dylib
          nm -g collector.dylib | grep _process
          ls -la collector.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: collector-dylib
          path: collector.dylib
          retention-days: 30