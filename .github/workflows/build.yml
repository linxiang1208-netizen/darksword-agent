name: Build Bootstrap v2

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid

      - name: Build dylib
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK_PATH"
          
          clang \
            -framework Foundation \
            -framework CoreFoundation \
            -framework UIKit \
            -framework Security \
            -framework CFNetwork \
            -lsqlite3 \
            -lcompression \
            -isysroot "$SDK_PATH" \
            -arch arm64 \
            -arch arm64e \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -dynamiclib \
            -Wno-availability \
            -Wno-deprecated-declarations \
            -o bootstrap.dylib \
            src/main.m
          
          echo "Build complete"

      - name: Sign
        run: |
          ldid -S bootstrap.dylib
          file bootstrap.dylib
          echo "Signed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-v2
          path: bootstrap.dylib
          retention-days: 30
