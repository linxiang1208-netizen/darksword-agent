name: Build DarkSword Agent

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid

      - name: Build dylib
        run: |
          # Get iOS SDK path
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK_PATH"
          
          # Compile
          clang \
            -framework Foundation \
            -framework Security \
            -framework UIKit \
            -lsqlite3 \
            -isysroot "$SDK_PATH" \
            -arch arm64 \
            -arch arm64e \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -dynamiclib \
            -install_name @rload/darksword-agent.dylib \
            -Wno-availability \
            -o darksword-agent.dylib \
            src/main.m
          
          echo "Build complete"

      - name: Sign
        run: |
          ldid -S darksword-agent.dylib
          echo "Signed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: darksword-agent
          path: darksword-agent.dylib
          retention-days: 30
