name: Build Collector Dylib
on:
  workflow_dispatch: {}
  push:
    branches: [master]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build collector.dylib for iOS arm64
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          echo "Files in src/:"
          ls -la src/
          
          # Compile entry + raw_collector as dylib
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -O2 \
            -fPIC \
            -o collector.dylib \
            src/collector_entry.c src/raw_collector.c \
            -isysroot "$SDK" \
            -miphoneos-version-min=13.0 \
            2>&1
          
          echo "Exit: $?"
          file collector.dylib 2>/dev/null
          nm -g collector.dylib 2>/dev/null | grep -E "_process|_ds_" | head -5
          ls -la collector.dylib 2>/dev/null

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: collector-dylib
          path: collector.dylib
          retention-days: 30