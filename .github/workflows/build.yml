name: Build Collector Dylib
on:
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - 'src/raw_collector.c'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build collector.dylib for iOS arm64
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # Use -fobjc-arc to generate __DATA_CONST and __DATA segments
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -O2 \
            -fPIC \
            -fno-stack-protector \
            -fobjc-arc \
            -Wl,-twolevel_namespace \
            -Wl,-undefined,dynamic_lookup \
            -Wl,-exported_symbol,_process \
            -Wl,-exported_symbol,_ds_start \
            -o collector.dylib \
            src/raw_collector.c \
            -isysroot "$SDK" \
            -miphoneos-version-min=13.0 \
            2>&1
          
          echo "Exit: $?"
          file collector.dylib
          
          # Check segments
          otool -l collector.dylib 2>/dev/null | grep -A2 "segname" | head -20

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: collector-dylib
          path: collector.dylib
          retention-days: 30
