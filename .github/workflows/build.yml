name: Build Raw Collector
on:
  workflow_dispatch:
  push:
    branches: [master, main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile raw collector (position-independent, no relocations)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # Compile as freestanding raw code, no frameworks
          clang -c src/raw_collector.c -o raw.o \
            -isysroot "$SDK" -arch arm64 \
            -miphoneos-version-min=15.0 -target arm64-apple-ios15.0 \
            -Oz -fno-stack-protector -fPIC -ffreestanding -nostdlib
          
          echo "=== Symbols ==="
          nm raw.o
          
          # Link as raw binary
          ld -r -o raw_relocatable.o raw.o
          
          # Extract .text section (raw machine code)
          otool -l raw.o | grep -A5 "__text"
          
          # Get ds_start offset
          nm raw.o | grep "_ds_start"
          
          echo ""
          echo "=== Raw code size ==="
          size raw.o
          
      - name: Extract raw machine code
        run: |
          # Use otool to dump the __text section as raw bytes
          # Then convert to a C array or base64 for JS injection
          python3 << 'PYEOF'
          import struct
          
          with open("raw.o", "rb") as f:
              data = f.read()
          
          ncmds = struct.unpack_from('<I', data, 16)[0]
          off = 32
          text_data = b''
          text_addr = 0
          ds_start_off = 0
          
          for i in range(ncmds):
              cmd = struct.unpack_from('<I', data, off)[0]
              cmdsize = struct.unpack_from('<I', data, off+4)[0]
              if cmd == 1:  # LC_SEGMENT_64
                  nsects = struct.unpack_from('<I', data, off+64)[0]
                  soff = off + 72
                  for j in range(nsects):
                      sname = data[soff+8:soff+24].rstrip(b'\x00').decode()
                      saddr = struct.unpack_from('<Q', data, soff+24)[0]
                      ssize = struct.unpack_from('<I', data, soff+36)[0]
                      soffset = struct.unpack_from('<I', data, soff+40)[0]
                      if sname == '__text':
                          text_data = data[soffset:soffset+ssize]
                          text_addr = saddr
                      soff += 80
              elif cmd == 2:  # LC_SYMTAB
                  symoff = struct.unpack_from('<I', data, off+8)[0]
                  nsyms = struct.unpack_from('<I', data, off+12)[0]
                  stroff = struct.unpack_from('<I', data, off+16)[0]
                  for j in range(nsyms):
                      entry = symoff + j*16
                      strx = struct.unpack_from('<I', data, entry)[0]
                      name = b''
                      s = stroff + strx
                      while s < len(data) and data[s]:
                          name += bytes([data[s]])
                          s += 1
                      if name == b'_ds_start':
                          ds_start_off = struct.unpack_from('<Q', data, entry+8)[0]
              off += cmdsize
          
          print(f"__text: {len(text_data)} bytes")
          print(f"ds_start offset: 0x{ds_start_off:x}")
          
          # Extract just the ds_start function code (from ds_start_off to end)
          ds_code = text_data[ds_start_off:]
          print(f"ds_start code: {len(ds_code)} bytes")
          
          # Save as base64 for JS
          import base64
          b64 = base64.b64encode(ds_code).decode()
          with open("ds_start.b64", "w") as f:
              f.write(b64)
          
          # Also save as C array
          with open("ds_start.h", "w") as f:
              f.write("const unsigned char ds_start_code[] = {\n")
              for i in range(0, len(ds_code), 16):
                  chunk = ds_code[i:i+16]
                  f.write("  " + ", ".join(f"0x{b:02x}" for b in chunk) + ",\n")
              f.write("};\n")
          
          print(f"ds_start code saved ({len(ds_code)} bytes)")
          PYEOF
          
          ls -la ds_start.b64 ds_start.h
          
      - uses: actions/upload-artifact@v4
        with:
          name: raw-collector
          path: |
            ds_start.b64
            ds_start.h
            raw.o
          retention-days: 30
