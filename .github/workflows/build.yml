name: Build Data Collector
on:
  workflow_dispatch:
  push:
    branches: [master, main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile collector.dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang src/main.m -o collector.dylib \
            -framework Foundation -framework CoreFoundation -framework Security \
            -framework CFNetwork -lsqlite3 \
            -isysroot "$SDK" -arch arm64 -arch arm64e \
            -miphoneos-version-min=15.0 -fobjc-arc -dynamiclib -Oz \
            -Wno-deprecated-declarations -Wno-availability
          ldid -S collector.dylib 2>/dev/null || brew install ldid && ldid -S collector.dylib
          file collector.dylib
          ls -la collector.dylib
          nm collector.dylib | grep "_ds_start\|_process"
      - uses: actions/upload-artifact@v4
        with:
          name: collector
          path: collector.dylib
