name: Build Collector Dylib
on:
  workflow_dispatch: {}
  push:
    branches: [master]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build collector.dylib for iOS arm64
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          ls -la src/
          
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -O0 \
            -fPIC \
            -fno-stack-protector \
            -fno-stack-check \
            -nostdlib \
            -Wl,-flat_namespace \
            -Wl,-undefined,suppress \
            -Wl,-no_compact_unwind \
            -Wl,-exported_symbol,_ds_start \
            -Wl,-exported_symbol,_ds_result \
            -Wl,-exported_symbol,_ds_result_len \
            -o collector.dylib \
            src/raw_collector.c \
            -isysroot "$SDK" \
            -miphoneos-version-min=13.0 \
            2>&1
          
          echo "Exit: $?"
          file collector.dylib 2>/dev/null
          ls -la collector.dylib 2>/dev/null

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: collector-dylib
          path: collector.dylib
          retention-days: 30