name: Build Bootstrap v3
on:
  workflow_dispatch:
  push:
    branches: [master, main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install ldid
      - name: Build
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -framework Foundation -framework CoreFoundation -framework Security \
            -framework CFNetwork -lsqlite3 \
            -isysroot "$SDK" -arch arm64 -arch arm64e \
            -miphoneos-version-min=15.0 -fobjc-arc -dynamiclib -Oz \
            -Wno-deprecated-declarations -Wno-availability \
            -o bootstrap.dylib src/main.m
      - name: Sign
        run: ldid -S bootstrap.dylib && file bootstrap.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-v3
          path: bootstrap.dylib
