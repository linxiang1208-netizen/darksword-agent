name: Build Collector Dylib
on:
  workflow_dispatch: {}
  push:
    branches: [master]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build collector.dylib for iOS arm64
        run: |
          set -ex
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -O2 \
            -fPIC \
            -o collector.dylib \
            src/collector_cf.c \
            -isysroot "$SDK" \
            -miphoneos-version-min=13.0 \
            -Wl,-no_compact_unwind
          
          echo "=== Verify ==="
          file collector.dylib
          nm -g collector.dylib | grep _process
          ls -la collector.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: collector-dylib
          path: collector.dylib
          retention-days: 30